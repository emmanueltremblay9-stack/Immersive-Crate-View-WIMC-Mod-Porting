modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Inspired by What's In My Crate (WIMC) by redcatone."
logoFile="immersive_crate_view_wimc_mod_porting_logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersiveengineering"
type="optional"
reason="Enables exact Immersive Engineering crate and reinforced crate detection."
versionRange="[12.4.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="immersive_engineer_decor_controls_tool_reforged"
type="optional"
reason="Enables exact Immersive Engineer Decor&Controls&Tool Reforged labeled crate detection."
versionRange="[1.1.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="engineers_decor_reforged"
type="optional"
reason="Keeps compatibility with legacy Engineer's Decor & Controls Reforged labeled crate jars."
versionRange="[1.1.0,)"
ordering="AFTER"
side="CLIENT"
