name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Check OpenWiki provider configuration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}${OPENAI_API_KEY}${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Set at least one repository secret: OPENROUTER_API_KEY, OPENAI_API_KEY, or ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Run OpenWiki
        run: openwiki --update --print
        env:
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || secrets.OPENWIKI_MODEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Guard documentation-only changes
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No OpenWiki changes detected."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(openwiki/|AGENTS\.md$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::OpenWiki workflow changed paths outside openwiki/ or AGENTS.md:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            openwiki/**
            AGENTS.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
