plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
    gradleVersion = '8.8'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

sourceSets {
    qa {
        java.srcDir('src/qa/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('qaPreviewModel', JavaExec) {
    group = 'verification'
    description = 'Runs lightweight regression checks for crate preview model behavior.'
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'com.emmanueltremblay.wimc.crate.CratePreviewContentsQa'
}

tasks.register('qaManualResources', JavaExec) {
    group = 'verification'
    description = 'Validates Engineer Manual resource hierarchy, anchors, links, recipes, and localization.'
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'com.emmanueltremblay.wimc.qa.ManualResourcesQa'
    args project.projectDir.absolutePath
}

tasks.register('qaTooltipLayout', JavaExec) {
    group = 'verification'
    description = 'Validates crate tooltip GUI layout arithmetic.'
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'com.emmanueltremblay.wimc.client.CratePreviewTooltipLayoutQa'
}

tasks.register('qaTooltipEvents', JavaExec) {
    group = 'verification'
    description = 'Validates crate tooltip event gating behavior.'
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'com.emmanueltremblay.wimc.client.CratePreviewTooltipEventsQa'
}

tasks.register('qaInstallScript', JavaExec) {
    group = 'verification'
    description = 'Validates the Windows Prism install script safety guards.'
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'com.emmanueltremblay.wimc.qa.InstallScriptQa'
    args project.projectDir.absolutePath
}

tasks.register('qaReleaseDocs', JavaExec) {
    group = 'verification'
    description = 'Validates release-facing docs for current namespace and resource references.'
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'com.emmanueltremblay.wimc.qa.ReleaseDocsQa'
    args project.projectDir.absolutePath
}

tasks.named('check').configure {
    dependsOn tasks.named('qaPreviewModel')
    dependsOn tasks.named('qaManualResources')
    dependsOn tasks.named('qaTooltipLayout')
    dependsOn tasks.named('qaTooltipEvents')
    dependsOn tasks.named('qaInstallScript')
    dependsOn tasks.named('qaReleaseDocs')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
